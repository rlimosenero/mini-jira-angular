<div class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm bg-white p-6 rounded-3xl">

    <h2 class="text-xl font-semibold mb-6">
      Create Account
    </h2>

    <input
      [(ngModel)]="username"
      placeholder="Username"
      class="w-full border p-3 mb-4 rounded"
    />

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
      class="w-full border p-3 mb-4 rounded"
    />

    <button
      (click)="submit()"
      class="w-full bg-black text-white rounded p-3">

      Register

    </button>

    <button
      (click)="cancel.emit()"
      class="w-full mt-2">

      Back to Login

    </button>

  </div>

</div>
